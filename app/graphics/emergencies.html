<head>

    <title>Even life-threatening calls can have long waits</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart" data-ems-chart="emergencies">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">Time-sensitive emergencies</p>
                <h3>Even life-threatening calls can have long waits</h3>
                <p>Median and 90th-percentile response times for selected Purple and Red emergency calls.</p>
            </figcaption>
            <div class="SA_ems-data-chart__graphic SA_ems-data-chart__graphic--tall" data-chart-mount role="img" aria-label="Dot plot comparing median and 90th-percentile response times for selected life-threatening emergencies"></div>
            <p class="SA_ems-data-chart__note">At the 90th percentile, nine in 10 calls received a response within the time shown, while one in 10 took longer.</p>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
