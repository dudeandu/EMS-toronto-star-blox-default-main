<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>When priority changed, it usually became more urgent</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart" data-ems-chart="escalation">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">Priority changes</p>
                <h3>When priority changed, it usually became more urgent</h3>
                <p>Direction of change among calls with both an initial and final priority recorded.</p>
            </figcaption>
            <div class="SA_ems-data-chart__graphic SA_ems-data-chart__graphic--compact" data-chart-mount role="img" aria-label="Stacked bar showing escalated, de-escalated and unchanged ambulance-call priorities"></div>
            <p class="SA_ems-data-chart__note">Initial priority is missing for 77.9% of calls, so its upgrade/down-grade comparison only represents records where an initial priority was available.</p>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
    <div id="insert-breaking-code" hidden></div>
    <nav id="SA_toc" hidden></nav>
