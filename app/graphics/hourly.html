<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>Demand and response times change hour by hour</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart SA_ems-data-chart--float SA_ems-data-chart--float-right" data-ems-chart="hourly">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">Pressure through the day</p>
                <h3>Demand and response times change hour by hour</h3>
                <p>Call volume and 90th-percentile response time by the hour in which the call was received.</p>
            </figcaption>
            <div class="SA_ems-data-chart__legend" data-chart-legend aria-hidden="true"></div>
            <div class="SA_ems-data-chart__graphic SA_ems-data-chart__graphic--trend" data-chart-mount role="img" aria-label="Line chart comparing hourly ambulance call volume with 90th-percentile response time"></div>
            <p class="SA_ems-data-chart__note">At the 90th percentile, nine in 10 calls received a response within the time shown, while one in 10 took longer.</p>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
    <div id="insert-breaking-code" hidden></div>
    <nav id="SA_toc" hidden></nav>
    <script src="js/script.min.js"></script>
</body>
</html>
