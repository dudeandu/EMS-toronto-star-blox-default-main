<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>Thousands of calls stretched beyond an hour</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart" data-ems-chart="multi-hour">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">Extreme response times</p>
                <h3>Thousands of calls stretched beyond an hour</h3>
                <p>Each dot is a call that took at least one hour. Calls are separated by final priority; response time increases from left to right.</p>
            </figcaption>
            <div class="SA_ems-data-chart__legend" data-chart-legend aria-hidden="true"></div>
            <div class="SA_ems-data-chart__graphic SA_ems-data-chart__graphic--compact" data-chart-mount role="img" aria-label="Horizontal beeswarm showing ambulance calls with waits beyond one hour, separated by final priority with response time on the horizontal axis"></div>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
    <div id="insert-breaking-code" hidden></div>
    <nav id="SA_toc" hidden></nav>
    <script src="js/script.min.js"></script>
</body>
</html>
