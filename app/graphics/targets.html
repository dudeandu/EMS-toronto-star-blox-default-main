    <title>Most of the highest-priority calls missed the target</title>
    <link rel="stylesheet" href="css/main.css" />

<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart" data-ems-chart="targets">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">Response targets</p>
                <h3>Most of the highest-priority calls missed the target</h3>
                <p>Share of calls that took longer than Toronto Paramedic Services’ official response goal, by final priority.</p>
            </figcaption>
            <div class="SA_ems-data-chart__graphic" data-chart-mount role="img" aria-label="Bar chart showing the percentage of ambulance calls above the official response goal by priority"></div>
            <p class="SA_ems-data-chart__note">Thick bars show all calls; thin lines show calls whose priority was unchanged from initial triage. Purple calls are imminently life-threatening; Red calls are potentially life-threatening. Referrals, Code 2 calls and scheduled transfers are excluded.</p>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
