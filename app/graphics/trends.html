<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="../" />
    <title>Response times shifted differently by priority</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body class="SA_graphic-standalone">
    <main><figure class="SA_ems-data-chart SA_ems-data-chart--wide" data-ems-chart="trends">
            <figcaption>
                <p class="SA_ems-data-chart__eyebrow">May 2025 to April 2026</p>
                <h3>Response times shifted differently by priority</h3>
                <p>Monthly average response time by final priority. Red ACP and Red PCP calls are combined.</p>
            </figcaption>
            <div class="SA_ems-data-chart__legend" data-chart-legend aria-hidden="true"></div>
            <div class="SA_ems-data-chart__graphic SA_ems-data-chart__graphic--trend" data-chart-mount role="img" aria-label="Line chart showing monthly average ambulance response time by priority"></div>
            <p class="SA_ems-data-chart__note">The combined Red average is weighted by the number of Red ACP and Red PCP calls each month.</p>
            <p class="SA_ems-data-chart__source">Source: Toronto Paramedic Services records obtained by the Toronto Star.</p>
        </figure></main>
    <div id="insert-breaking-code" hidden></div>
    <nav id="SA_toc" hidden></nav>
    <script src="js/script.min.js"></script>
</body>
</html>
